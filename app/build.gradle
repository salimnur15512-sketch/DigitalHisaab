plugins { id 'com.android.application' }

android {
    namespace 'com.salimmulani.masjidhisab'
    compileSdk 34

    defaultConfig {
        applicationId 'com.salimmulani.masjidhisab.test'
        minSdk 23
        targetSdk 34
        versionCode 2
        versionName '2.0'
    }

    signingConfigs {
        release {
            storeFile file(System.getenv("KEYSTORE_FILE") ?: "masjid-release.jks")
            storePassword System.getenv("KEYSTORE_PASSWORD")
            keyAlias "masjid"
            keyPassword System.getenv("KEYSTORE_PASSWORD")
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
}
